name: Feature / Content Suggestion
description: Suggest an improvement, new feature, or documentation update
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting an enhancement or documentation correction for the TIV platform.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or gap?
      description: A clear and concise description of the problem or missing content.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Content
      description: Describe what you would like to see changed or added.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any references, links, or screenshots.
    validations:
      required: false
