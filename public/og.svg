<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#09090B"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#27272A" stroke-width="4"/>
  
  <!-- Accent top line -->
  <rect x="60" y="60" width="80" height="4" fill="#E5484D"/>

  <!-- TIV Logo Mark -->
  <rect x="60" y="90" width="56" height="56" rx="8" fill="#E5484D"/>
  <text x="88" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">T</text>
  <text x="136" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#E5484D" letter-spacing="0.05em">TIV</text>
  
  <!-- Category Badge -->
  <rect x="960" y="90" width="180" height="36" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
  <text x="1050" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="0.15em">TECHNOLOGY</text>

