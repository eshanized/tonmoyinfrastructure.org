  <text x="60" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" fill="#F4F4F5" letter-spacing="-0.02em">Tonmoy Infrastructure and Vision</text>
  <text x="60" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#A1A1AA">Building practical software, internet infrastructure, networking systems,</text>
  <text x="60" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#A1A1AA">and emerging technologies that people can deploy, operate, and depend on.</text>

