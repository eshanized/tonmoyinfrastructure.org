  <text x="60" y="568" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#71717A">tonmoyinfrastructure.org · Technology Infrastructure &amp; Open Systems</text>
  <text x="1140" y="568" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#E5484D" text-anchor="end">Official Technical Presence</text>
